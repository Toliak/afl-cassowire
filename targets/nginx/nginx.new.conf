# Fuzzing config aimed at maximum coverage of the HTTP input path.
# Entry point: 127.0.0.1:8080 (plain HTTP/1.x, also h2c via `http2 on`).
# Backends are self-looped to 127.0.0.1:8090 inside the same process.
# Fixtures live in /opt/workdir/targets/nginx/data.

daemon off;
master_process off;
worker_processes 1;
error_log /dev/stderr emerg;
pid /tmp/nginx-fuzz/nginx.pid;

thread_pool default threads=2 max_queue=64;

events {
    worker_connections 1024;
}

http {
    include       /opt/workdir/targets/nginx/data/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx-fuzz/client-body;
    proxy_temp_path       /tmp/nginx-fuzz/proxy;
    fastcgi_temp_path     /tmp/nginx-fuzz/fastcgi;
    scgi_temp_path        /tmp/nginx-fuzz/scgi;
    uwsgi_temp_path       /tmp/nginx-fuzz/uwsgi;

    access_log off;

    # ---- core / buffers / timeouts -------------------------------------
    sendfile                 on;
    tcp_nopush               on;
    tcp_nodelay              on;
    aio                      threads;
    directio                 512;
    keepalive_timeout        5s;
    keepalive_requests       1000;
    client_header_timeout    5s;
    client_body_timeout      5s;
    send_timeout             5s;
    lingering_close          off;
    reset_timedout_connection on;
    client_max_body_size     2m;
    client_body_buffer_size  4k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    underscores_in_headers   on;
    ignore_invalid_headers   off;
    merge_slashes            on;
    server_tokens            on;
    absolute_redirect        off;
    server_name_in_redirect  off;
    log_not_found            off;
    variables_hash_max_size  2048;
    types_hash_max_size      2048;
    open_file_cache          max=100 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;
    output_buffers           2 8k;
    postpone_output          0;

    # ---- compression filters ------------------------------------------
    gzip              on;
    gzip_min_length   1;
    gzip_comp_level   4;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_http_version 1.0;
    gzip_types        text/plain text/css application/json application/xml;
    gzip_disable      "msie6";
    gzip_static       on;

    # ---- realip / referer / browser / degradation ---------------------
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  ::1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    modern_browser    msie 8.0;
    modern_browser    gecko 1.0;
    modern_browser    unlisted;
    ancient_browser   MSIE Mozilla/4;
    ancient_browser_value 1;
    modern_browser_value  2;

    degradation       sbrk=1m;

    # ---- maps / geo / split_clients -----------------------------------
    map $http_user_agent $ua_class {
        default        other;
        ~*curl         curl;
        ~*mozilla      browser;
        "~^(?<ua_n>\w+)/" $ua_n;
    }

    map $request_uri $uri_hash_key {
        volatile;
        default        $request_uri;
        ~^/a/(.*)$     $1;
    }

    map $http_x_mode $mode_upstream {
        hostnames;
        default        be_rr;
        hash           be_hash;
        iphash         be_iphash;
        lc             be_lc;
        rnd            be_rnd;
        lt             be_lt;
        sticky         be_sticky;
        *.example.com  be_hash;
    }

    geo $remote_addr $geo_class {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     2;
        ::1/128        3;
        proxy 127.0.0.1;
    }

    geo $geo_range {
        ranges;
        default        none;
        1.0.0.0-1.255.255.255  one;
    }

    split_clients "${remote_addr}${http_user_agent}" $ab_variant {
        25%   a;
        25%   b;
        *     c;
    }

    # ---- limit zones ---------------------------------------------------
    limit_conn_zone $binary_remote_addr zone=conn:1m;
    limit_req_zone  $binary_remote_addr zone=req:1m rate=100000r/s;
    limit_conn_status 503;
    limit_req_status  503;

    # ---- log formats (exercises complex values / variables) -----------
    log_format full '$remote_addr $remote_user [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time $upstream_addr '
                    '$upstream_status $connection $connection_requests '
                    '$request_length $sent_http_content_type $gzip_ratio '
                    '$msec $pipe $request_completion $ssl_protocol';
    access_log /dev/null full buffer=4k flush=1s;

    # ---- proxy cache ---------------------------------------------------
    proxy_cache_path   /tmp/nginx-fuzz/cache levels=1:2 keys_zone=pc:1m max_size=8m inactive=1m use_temp_path=off;
    fastcgi_cache_path /tmp/nginx-fuzz/fcache levels=1:2 keys_zone=fc:1m max_size=8m;
    uwsgi_cache_path   /tmp/nginx-fuzz/ucache levels=1 keys_zone=uc:1m max_size=8m;
    scgi_cache_path    /tmp/nginx-fuzz/scache levels=1 keys_zone=sc:1m max_size=8m;

    # ---- charset -------------------------------------------------------
    charset_map koi8-r utf-8 {
        C0 D18E;
        C1 D0B0;
    }
    charset_types text/plain;

    # ---- upstreams (all loop to the in-process backend) ---------------
    upstream be_rr {
        zone be_rr 64k;
        server 127.0.0.1:8090 weight=2 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:8091 weight=1 backup;
        server 127.0.0.1:8092 down;
        keepalive 4;
        keepalive_requests 100;
        keepalive_time 1m;
        keepalive_timeout 10s;
    }

    upstream be_hash {
        zone be_hash 64k;
        hash $uri_hash_key consistent;
        server 127.0.0.1:8090;
        server 127.0.0.1:8091;
    }

    upstream be_iphash {
        zone be_iphash 64k;
        ip_hash;
        server 127.0.0.1:8090;
        server 127.0.0.1:8091;
    }

    upstream be_lc {
        zone be_lc 64k;
        least_conn;
        server 127.0.0.1:8090 max_conns=100;
        server 127.0.0.1:8091;
    }

    upstream be_rnd {
        zone be_rnd 64k;
        random two least_conn;
        server 127.0.0.1:8090;
        server 127.0.0.1:8091;
    }

    upstream be_lt {
        zone be_lt 64k;
        least_time header;
        server 127.0.0.1:8090;
        server 127.0.0.1:8091;
    }

    upstream be_sticky {
        zone be_sticky 64k;
        sticky cookie srv_id expires=1h path=/;
        server 127.0.0.1:8090;
        server 127.0.0.1:8091;
    }

    upstream be_h2 {
        server 127.0.0.1:8090;
        keepalive 2;
    }

    # ====================================================================
    # Backend: canned responses served by the same process
    # ====================================================================
    server {
        listen 127.0.0.1:8090 reuseport;
        listen 127.0.0.1:8091 reuseport;
        listen 127.0.0.1:8092 reuseport;
        server_name backend;

        add_header X-Backend "yes" always;

        location = /ok          { return 200 "ok\n"; }
        location = /cacheable   {
            add_header Cache-Control "public, max-age=60";
            add_header ETag '"abc"';
            return 200 "cached body\n";
        }
        location = /stale       {
            add_header Cache-Control "max-age=0, stale-while-revalidate=30, stale-if-error=30";
            return 200 "stale\n";
        }
        location = /redirect    { return 302 /ok; }
        location = /error500    { return 500 "boom\n"; }
        location = /error502    { return 502; }
        location = /nobody      { return 204; }
        location = /xaccel      {
            add_header X-Accel-Redirect /protected/file.txt;
            add_header X-Accel-Limit-Rate 1024;
            add_header X-Accel-Buffering no;
            add_header X-Accel-Charset utf-8;
            return 200;
        }
        location = /setcookie   {
            add_header Set-Cookie "a=b; Domain=example.com; Path=/x; Secure; HttpOnly";
            add_header Link "</style.css>; rel=preload; as=style";
            return 200 "cookie\n";
        }
        location = /hint        {
            add_header Link "</s.css>; rel=preload";
            return 103;
        }
        location = /loc         { add_header Location "http://backend:8090/ok"; return 301; }
        location = /refresh     { add_header Refresh "0; url=http://backend:8090/ok"; return 200; }
        location = /chunked     {
            chunked_transfer_encoding on;
            default_type text/html;
            return 200 "<html><!--#echo var='date_gmt' -->chunked body</html>";
        }
        location = /trailer     {
            add_trailer X-Trailer "t" always;
            return 200 "trailers\n";
        }
        location = /echo-ua     { return 200 "$http_user_agent|$http_cookie|$http_x_forwarded_for|$request_method|$request_uri\n"; }
        location /              {
            root /opt/workdir/targets/nginx/data/www;
            try_files $uri $uri/ =404;
        }
        location /protected/ {
            internal;
            alias /opt/workdir/targets/nginx/data/www/;
        }
    }

    # ====================================================================
    # Main fuzzed server (127.0.0.1:8080)
    # ====================================================================
    server {
        listen 8080 reuseport backlog=511 so_keepalive=on rcvbuf=65536 sndbuf=65536;
        server_name localhost fuzz.example.com *.example.com ~^(?<sub>.+)\.regex\.test$ _;

        http2 on;
        http2_max_concurrent_streams 128;
        http2_chunk_size 4k;

        root  /opt/workdir/targets/nginx/data/www;
        index index.html index.htm index.shtml;

        limit_conn conn 1000;
        limit_req  zone=req burst=1000 nodelay;

        set $mark "v";
        add_header X-Ua-Class $ua_class always;
        add_header X-Geo "$geo_class/$geo_range/$ab_variant" always;
        add_header X-Browser "$modern_browser|$ancient_browser|$msie" always;
        add_header X-Real "$realip_remote_addr" always;
        expires modified +1h;

        # per-request-phase checks
        if ($http_x_block = "1")       { return 403; }
        if ($arg_redir)                { rewrite ^ /ok break; }
        if ($request_method = POST)    { set $mark "p"; }
        if ($http_cookie ~* "sid=(\d+)") { set $mark "c$1"; }

        # ---- rewrite module ----
        rewrite ^/old/(.*)$        /new/$1  last;
        rewrite ^/permanent/(.*)$  /ok      permanent;
        rewrite ^/temp/(.*)$       /ok?$1   redirect;
        rewrite_log off;
        uninitialized_variable_warn off;

        location = /ok { return 200 "ok\n"; }
        location /new/ { return 200 "new $uri\n"; }

        # ---- static / index / autoindex / try_files ----
        location / {
            autoindex on;
            autoindex_format html;
            autoindex_exact_size off;
            autoindex_localtime on;
            if ($request_method = CONNECT) {
                tunnel_pass 127.0.0.1:8090;
            }
            try_files $uri $uri/ /index.html =404;
        }

        location /dir/ {
            autoindex on;
            autoindex_format json;
        }
        location /dir/sub/ {
            autoindex on;
            autoindex_format xml;
            autoindex_exact_size on;
        }
        location /dir2/ {
            alias /opt/workdir/targets/nginx/data/www/dir/;
            autoindex on;
            autoindex_format jsonp;
        }
        location ~ ^/re/(?<name>[a-z]+)\.txt$ {
            alias /opt/workdir/targets/nginx/data/www/$name.txt;
        }
        location ^~ /prefix/ { return 200 "prefix\n"; }
        location ~* \.(gif|jpe?g)$ { empty_gif; }
        location = /empty.gif { empty_gif; }
        location @named { return 200 "named\n"; }

        # ---- range / mp4 / flv / slice ----
        location ~ \.mp4$ {
            mp4;
            mp4_buffer_size 512k;
            mp4_max_buffer_size 4m;
            mp4_start_key_frame on;
        }
        location ~ \.flv$ {
            flv;
        }
        location /slice/ {
            alias /opt/workdir/targets/nginx/data/www/;
            slice 8;
            proxy_pass http://127.0.0.1:8090/;
            proxy_set_header Range $slice_range;
            proxy_http_version 1.1;
            proxy_cache pc;
            proxy_cache_key $uri$is_args$args$slice_range;
            proxy_cache_valid 200 206 1m;
        }
        location /maxrange/ {
            alias /opt/workdir/targets/nginx/data/www/;
            max_ranges 4;
            add_header Accept-Ranges bytes;
        }
        location /norange/ {
            alias /opt/workdir/targets/nginx/data/www/;
            max_ranges 0;
        }

        # ---- gzip_static / gunzip ----
        location /gz/ {
            alias /opt/workdir/targets/nginx/data/www/;
            gzip_static always;
            gunzip on;
            gunzip_buffers 16 8k;
        }

        # ---- ssi / sub / addition ----
        location /ssi/ {
            ssi on;
            ssi_silent_errors off;
            ssi_value_length 256;
            ssi_types text/plain text/html;
            ssi_last_modified on;
            ssi_min_file_chunk 1k;
            ssi_ignore_recycled_buffers off;
            add_before_body /ssi/inc.txt;
            add_after_body  /ssi/inc.txt;
            addition_types  text/plain text/html;
        }
        location /sub/ {
            alias /opt/workdir/targets/nginx/data/www/;
            sub_filter         'hello' 'HELLO-$mark';
            sub_filter_once    off;
            sub_filter_types   text/html text/plain;
            sub_filter_last_modified on;
        }
        location /addition/ {
            alias /opt/workdir/targets/nginx/data/www/;
            add_before_body /ok;
            add_after_body  /ok;
        }

        # ---- charset ----
        location /charset/ {
            alias /opt/workdir/targets/nginx/data/www/;
            charset utf-8;
            source_charset koi8-r;
            override_charset on;
        }
        location /charset2/ {
            alias /opt/workdir/targets/nginx/data/www/;
            charset koi8-r;
            source_charset utf-8;
        }

        # ---- auth_basic / access / satisfy / auth_request ----
        location /auth/ {
            alias /opt/workdir/targets/nginx/data/www/;
            auth_basic "restricted";
            auth_basic_user_file /opt/workdir/targets/nginx/data/htpasswd;
        }
        location /access/ {
            alias /opt/workdir/targets/nginx/data/www/;
            satisfy any;
            allow 127.0.0.1;
            allow ::1;
            allow 10.0.0.0/8;
            deny  all;
            auth_basic "x";
            auth_basic_user_file /opt/workdir/targets/nginx/data/htpasswd;
        }
        location /authreq/ {
            alias /opt/workdir/targets/nginx/data/www/;
            auth_request /_auth;
            auth_request_set $auth_status $upstream_status;
            add_header X-Auth $auth_status always;
        }
        location = /_auth {
            internal;
            proxy_pass http://127.0.0.1:8090/ok;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }
        location /limited/ {
            alias /opt/workdir/targets/nginx/data/www/;
            limit_except GET HEAD { deny all; }
            limit_rate 1m;
            limit_rate_after 100k;
        }

        # ---- secure_link ----
        location /secure/ {
            alias /opt/workdir/targets/nginx/data/www/;
            secure_link $arg_md5,$arg_expires;
            secure_link_md5 "$secure_link_expires$uri secret";
            if ($secure_link = "")  { return 403; }
            if ($secure_link = "0") { return 410; }
        }
        location /secure2/ {
            alias /opt/workdir/targets/nginx/data/www/;
            secure_link $arg_st,$arg_e;
        }

        # ---- referer / userid ----
        location /referer/ {
            alias /opt/workdir/targets/nginx/data/www/;
            valid_referers none blocked server_names *.referer.test referer.* ~\.google\. other.test/path;
            referer_hash_bucket_size 128;
            referer_hash_max_size 2048;
            if ($invalid_referer) { return 403; }
        }
        location /uid/ {
            alias /opt/workdir/targets/nginx/data/www/;
            userid on;
            userid_name uid;
            userid_domain example.com;
            userid_path /;
            userid_expires 1h;
            userid_p3p 'policyref="/w3c/p3p.xml"';
            userid_service 1;
            userid_flags secure httponly samesite=lax;
            add_header X-Uid "$uid_got|$uid_set" always;
        }

        # ---- random_index / stub_status / dav ----
        location /random/ {
            random_index on;
        }
        location = /status {
            stub_status;
        }
        location /dav/ {
            alias /opt/workdir/targets/nginx/data/dav/;
            dav_methods PUT DELETE MKCOL COPY MOVE;
            create_full_put_path on;
            dav_access user:rw group:rw all:r;
            client_body_in_file_only clean;
            client_max_body_size 1m;
        }

        # ---- mirror ----
        location /mirror/ {
            mirror /mirror_target;
            mirror_request_body on;
            return 200 "mirrored\n";
        }
        location = /mirror_target {
            internal;
            proxy_pass http://127.0.0.1:8090/ok;
            proxy_set_header X-Mirror 1;
        }

        # ---- proxy (HTTP/1.0, HTTP/1.1, HTTP/2 via proxy_v2), cache ----
        location /proxy/ {
            proxy_pass http://be_rr/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect default;
            proxy_redirect http://backend:8090/ /proxy/;
            proxy_cookie_domain example.com $host;
            proxy_cookie_path /x /proxy/x;
            proxy_cookie_flags ~ nosecure samesite=lax;
            proxy_next_upstream error timeout http_500 http_502 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_intercept_errors on;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 4 4k;
            proxy_busy_buffers_size 8k;
            proxy_max_temp_file_size 1m;
            proxy_pass_header Server;
            proxy_hide_header X-Backend-Hidden;
            proxy_ignore_headers X-Accel-Expires;
            proxy_set_body "$request_body|$mark";
            error_page 500 502 /ok;
        }
        location /proxy-cache/ {
            proxy_pass http://be_hash/;
            proxy_http_version 1.1;
            proxy_cache pc;
            proxy_cache_key $scheme$host$request_uri;
            proxy_cache_valid 200 301 302 1m;
            proxy_cache_valid any 10s;
            proxy_cache_methods GET HEAD POST;
            proxy_cache_use_stale error timeout updating http_500 http_502;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 1s;
            proxy_cache_min_uses 1;
            proxy_cache_revalidate on;
            proxy_cache_bypass $http_x_bypass;
            proxy_no_cache $http_x_nocache;
            proxy_ignore_client_abort on;
            add_header X-Cache $upstream_cache_status always;
        }
        location /proxy-h2/ {
            proxy_pass http://be_h2/;
            proxy_http_version 2;
            proxy_set_header Host $host;
            proxy_cache pc;
            proxy_cache_valid 200 1m;
            proxy_read_timeout 2s;
        }
        location /proxy10/ {
            proxy_pass http://be_iphash/;
            proxy_http_version 1.0;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 2s;
        }
        location /proxy-lb/ {
            proxy_pass http://$mode_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 2s;
        }
        location /proxy-lc/ { proxy_pass http://be_lc/;     proxy_read_timeout 2s; }
        location /proxy-rnd/ { proxy_pass http://be_rnd/;   proxy_read_timeout 2s; }
        location /proxy-lt/ { proxy_pass http://be_lt/;     proxy_read_timeout 2s; }
        location /proxy-sticky/ { proxy_pass http://be_sticky/; proxy_read_timeout 2s; }
        location /proxy-var/ {
            proxy_pass http://127.0.0.1:8090$request_uri;
            proxy_read_timeout 2s;
        }
        location /proxy-xaccel/ {
            proxy_pass http://127.0.0.1:8090/xaccel;
            proxy_read_timeout 2s;
        }
        location /proxy-bind/ {
            proxy_pass http://127.0.0.1:8090/;
            proxy_bind 127.0.0.1;
            proxy_socket_keepalive on;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_read_timeout 2s;
        }
        location /proxy-ssl/ {
            proxy_pass https://127.0.0.1:8443/;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_session_reuse on;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }

        # ---- fastcgi / uwsgi / scgi / grpc / memcached (loop to backend) ----
        location /fcgi/ {
            fastcgi_pass 127.0.0.1:8090;
            include /opt/workdir/targets/nginx/data/fastcgi.conf;
            fastcgi_index index.php;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_PROXY "";
            fastcgi_keep_conn on;
            fastcgi_read_timeout 2s;
            fastcgi_connect_timeout 1s;
            fastcgi_cache fc;
            fastcgi_cache_key $request_uri;
            fastcgi_cache_valid 200 1m;
            fastcgi_intercept_errors on;
            fastcgi_buffer_size 4k;
            fastcgi_buffers 4 4k;
        }
        location /uwsgi/ {
            uwsgi_pass 127.0.0.1:8090;
            include /opt/workdir/targets/nginx/data/uwsgi_params;
            uwsgi_modifier1 0;
            uwsgi_read_timeout 2s;
            uwsgi_connect_timeout 1s;
            uwsgi_cache uc;
            uwsgi_cache_key $request_uri;
            uwsgi_cache_valid 200 1m;
        }
        location /scgi/ {
            scgi_pass 127.0.0.1:8090;
            include /opt/workdir/targets/nginx/data/scgi_params;
            scgi_read_timeout 2s;
            scgi_connect_timeout 1s;
            scgi_cache sc;
            scgi_cache_key $request_uri;
            scgi_cache_valid 200 1m;
        }
        location /grpc/ {
            grpc_pass grpc://127.0.0.1:8090;
            grpc_set_header X-Test $mark;
            grpc_read_timeout 2s;
            grpc_connect_timeout 1s;
            grpc_intercept_errors on;
        }
        location /memc/ {
            set $memcached_key $uri$is_args$args;
            memcached_pass 127.0.0.1:8090;
            memcached_read_timeout 2s;
            memcached_connect_timeout 1s;
            memcached_gzip_flag 2;
            error_page 404 502 504 = @named;
        }

        # ---- tunnel (CONNECT) ----
        location /tunnel/ {
            tunnel_pass 127.0.0.1:8090;
            tunnel_connect_timeout 1s;
            tunnel_read_timeout 2s;
            tunnel_send_timeout 2s;
        }

        # ---- error pages / internal redirects / named locations ----
        error_page 400 401 402 403 404 405 408 410 411 412 413 414 415 416 421 429 /errors/e.html;
        error_page 500 501 502 503 504 =200 @named;
        location /errors/ {
            internal;
            alias /opt/workdir/targets/nginx/data/www/;
            try_files /index.html =404;
        }
        location /internal-redirect/ {
            add_header X-Accel-Redirect "/ok";
            return 200;
        }
        location /echo {
            default_type text/plain;
            return 200 "$request_method $request_uri $args $arg_a $http_host $http_user_agent $cookie_sid $content_type $content_length $remote_addr:$remote_port $server_protocol $request_id $uri $document_uri $realpath_root $request_body_file $is_args $hostname $nginx_version $pid $scheme $server_port $time_iso8601 $time_local $http_connection $http_upgrade $http_te $http_range $http_if_modified_since $http_if_none_match $http_if_range $http_x_forwarded_for $http_authorization $http_accept_encoding $sent_http_content_length $limit_rate $binary_remote_addr $connection $request_time $request_length $body_bytes_sent $bytes_sent $status $proxy_protocol_addr $proxy_protocol_port $server_addr $server_name $tcpinfo_rtt $ssl_server_name";
        }
        location /body {
            client_body_in_single_buffer on;
            client_body_in_file_only off;
            client_body_buffer_size 16k;
            proxy_pass http://127.0.0.1:8090/ok;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_read_timeout 2s;
        }
        location /chunk { chunked_transfer_encoding on; return 200 "chunk\n"; }
        location /lingering {
            lingering_close always;
            lingering_time 2s;
            lingering_timeout 1s;
            return 200 "l\n";
        }
        location /trailers { add_trailer X-T $mark always; return 200 "t\n"; }
        location /etag     { etag on; root /opt/workdir/targets/nginx/data/www; }
        location /ims      { if_modified_since before; root /opt/workdir/targets/nginx/data/www; }
        location /types    { default_type text/html; types { text/html foo; } return 200 "t\n"; }
        location /expires  { expires @12h30m; add_header Cache-Control "public"; root /opt/workdir/targets/nginx/data/www; }
        location /headers  {
            add_header X-A "a" always;
            add_header X-Mark "$mark" always;
            return 200 "h\n";
        }
        location /satisfy  { satisfy all; allow 127.0.0.1; deny all; return 200 "s\n"; }
        location /post     { return 200 "post $request_body\n"; }
        location /readahead { read_ahead 16k; directio 4k; root /opt/workdir/targets/nginx/data/www; }

        # ---- SSL directives (config-time) ----
        ssl_certificate         /opt/workdir/targets/nginx/data/certs/cert.pem;
        ssl_certificate_key     /opt/workdir/targets/nginx/data/certs/key.pem;
    }

    # ====================================================================
    # TLS server: loaded for config coverage; TCP+UDP (QUIC) listeners
    # ====================================================================
    server {
        listen 8443 ssl reuseport;
        listen 8443 quic reuseport;
        server_name tls.example.com;

        http2 on;
        http3 on;
        http3_hq off;
        http3_max_concurrent_streams 128;
        http3_stream_buffer_size 64k;
        quic_retry off;
        quic_gso off;
        quic_active_connection_id_limit 2;

        ssl_certificate      /opt/workdir/targets/nginx/data/certs/cert.pem;
        ssl_certificate_key  /opt/workdir/targets/nginx/data/certs/key.pem;
        ssl_dhparam          /opt/workdir/targets/nginx/data/certs/dh.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_session_tickets  on;
        ssl_session_ticket_key /opt/workdir/targets/nginx/data/certs/ticket.key;
        ssl_buffer_size      4k;
        ssl_early_data       on;
        ssl_verify_client    optional_no_ca;
        ssl_verify_depth     2;
        ssl_stapling         off;
        ssl_conf_command     Options PrioritizeChaCha;
        ssl_reject_handshake off;
        add_header Alt-Svc 'h3=":8443"; ma=86400' always;
        add_header X-Ssl "$ssl_protocol|$ssl_cipher|$ssl_client_verify|$ssl_early_data|$http3" always;

        location / {
            root /opt/workdir/targets/nginx/data/www;
            index index.html;
        }
    }
}
