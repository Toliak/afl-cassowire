# Run in the foreground (required for fuzzing harnesses)
daemon off;

# Disable the master process - run as a single process.
# This is CRITICAL for fork-server mode to work correctly.
master_process off;

# Redirect all error logs to /dev/null to avoid I/O bottlenecks
error_log /dev/stderr;

pid /tmp/nginx.pid;

events {
    # Max connections per worker
    worker_connections 1024;

    # Use the 'select' event model. 
    # This is often more compatible with tools like 'preeny' 
    # that redirect socket input to stdin.
    # use select;

    # Disable multi-accept. Process one connection at a time.
    # multi_accept off;
}

http {
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;

    # Turn off access logs entirely
    access_log /dev/stdout;

    server {
        # Use a non-privileged port (no root required)
        listen 9080 reuseport;

        # Simple static response for all requests
        location / {
            return 200 "Hello World\n";
        }
    }
}
