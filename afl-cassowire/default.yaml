# yaml-language-server: $schema=./schema/config.schema.json

# Default configuration for afl-cassowire
# Copy this to config.yaml and adjust values as needed.

# Root keys starting with "__" (e.g. `__helpers`) are ignored by the config
# parser and by the schema: a reserved namespace for helper fragments that
# real sections below reuse via YAML anchors/aliases or merge keys (`<<`).
# Example:
#   __net: &shared_net
#     host: "127.0.0.1"
#     port: 8080
#   network: *shared_net
# The exemption is root-only: `__`-prefixed keys inside target/network/afl/...
# are still rejected as unknown keys.

target:
  binary: "./target"           # Path to the target binary (required)
  # args: []                   # Full argv; argv[0] goes first. Omit `args` instead of
                               # passing an empty list (an empty list is rejected) —
                               # when omitted, argv defaults to [binary].
  # env_preserve: afl_only     # Parent env inheritance: "nothing", "afl_only"
                               # (PATH, __AFL_SHM_ID, __AFL_CMPLOG_SHM_ID,
                               # ___AFL_EINS_ZWEI_POLIZEI___), or "all"

network: &net
  host: "127.0.0.1"            # TCP host to connect to
  port: 8080                   # Port to connect to (1-65535, required)
  timeout_ms: 200              # Network send/recv timeout in milliseconds
  initial_ms: 200              # Port detection timeout in milliseconds
  probe: true                  # Post-response quiescence probe: after each response,
                                # open a throwaway connection and wait until the target
                                 # services it (data/EOF/RST). Catches crashes in
                                 # post-response cleanup within the same iteration.
                                 # Disable for targets that rate-limit connections or
                                 # cannot tolerate an extra short-lived connection.
  probe_retry_ms: 5             # Delay in milliseconds between probe retries when the
                                 # first probe fails. Set to 0 for no delay.

afl:
  loop_count: 50000            # Number of __AFL_LOOP iterations
  enable_cmplog: false         # Enable AFL compare log (requires __AFL_CMPLOG_SHM_ID)

target_cmplog:                 # Compare-mode target (used instead of `target` when __AFL_CMPLOG_SHM_ID is set)
  binary: "./target-cmplog"    # Path to the compare-mode target binary (required)
  args: []                     # Additional arguments (binary is added automatically)
  env: {}                      # Environment variables for target
  env_preserve: afl_only       # Parent env inheritance: "nothing", "afl_only", or "all"


network_cmplog:                # Compare-mode network (used instead of `network` when __AFL_CMPLOG_SHM_ID is set)
  host: "127.0.0.1"            # Required when afl.enable_cmplog: true. The section is standalone:
  port: 8081                   # no key falls back to `network:` (e.g. the cmplog target may listen
  timeout_ms: 200              # on a different port). Keys and validation are identical to
  initial_ms: 200              # `network:` (port required 1-65535, rest optional).
  probe: true                  # To reuse the whole section unchanged: `network_cmplog: *net`
                                 # (yaml-cpp does NOT support `<<` merge keys, so per-key overrides
                                 # require writing the full section).
  probe_retry_ms: 5            # Delay in milliseconds between probe retries when the
                                 # first probe fails. Set to 0 for no delay.

port_detection:
  primary: "procfs"            # Method: "procfs", "ptrace", or "seccomp"
  # defork: false              # seccomp only: cancel every non-thread fork()/vfork()/clone()
                               # inside the target in-kernel (SECCOMP_RET_ERRNO|0 makes the
                               # syscall return 0 without creating a process). The target runs
                               # de-forked: worker "child" code executes in the caller. Threads
                               # (clone with CLONE_THREAD) are unaffected. Requires
                               # primary: "seccomp". clone3() is not trapped.

cleanup:
  force_kill_ms: 2000          # Wait time after SIGTERM before SIGKILL
  # kill_pattern:              # Optional: auto-kill stale target processes
    # Scalar form — matches /proc/<pid>/comm:
    # "nginx"
    #
    # Object form — explicit match:
    # type: comm                   # or "regexp"
    # value: "nginx"
    # target: "comm"              # or "argv0", "argv"

# Optional payload wrapping: every payload sent to the target (in `proxy`
# and `test` mode) is transmitted as: prefix + fuzz input + suffix.
# Values may be a plain string or `!!binary` base64-encoded bytes.
payload:
  # Ability to add the payload prefix
  # prefix: "GET /index.html HTTP/1.1"

  # Ability to add the payload suffix
  suffix: !!binary DQoNCg==

  # The prefix and suffix may be string or bytes
  # Omit the whole section (or a key) to send the payload unmodified.
